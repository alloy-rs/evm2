[package]
name = "evm2-fork"
description = "RPC forking database for evm2"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
evm2 = { workspace = true, features = ["serde", "std"] }

alloy-chains = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-eips = { workspace = true, features = ["std"] }
alloy-hardforks.workspace = true
alloy-primitives = { workspace = true, features = ["map", "serde", "std"] }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-rpc-client = { workspace = true, features = ["reqwest"] }
alloy-rpc-types-eth = { workspace = true, features = ["std"] }
futures-util.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
evm2 = { workspace = true, features = ["block"] }
alloy-json-rpc.workspace = true
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-transport.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tower.workspace = true

[[example]]
name = "fork_block"
path = "examples/fork_block.rs"

[[example]]
name = "fork_call"
path = "examples/fork_call.rs"
