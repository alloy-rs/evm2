name: Benchmark

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

jobs:
  jit:
    name: jit codegen benchmark
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 45
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read
    env:
      BASE_BRANCH: ${{ github.base_ref || 'main' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@2ab28a31ae569be9f780c7675b684471060afa40 # 2026-10-09T21-43-19Z-2ab28a31
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install LLVM
        run: .github/scripts/install_llvm.sh ubuntu
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@2ab28a31ae569be9f780c7675b684471060afa40 # 2026-10-09T21-43-19Z-2ab28a31
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-bin: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Enable perf counters
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1
          # Runner kernels often have no matching linux-tools package. perf's user-space tool
          # works across kernel versions, so fall back to the newest packaged one.
          if ! perf stat -e instructions:u true >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" linux-tools-common ||
              sudo apt-get install -y --no-install-recommends linux-tools-generic linux-tools-common || true
            perf_bin="$(find /usr/lib/linux-tools* -name perf -type f 2>/dev/null | sort -V | tail -n1)"
            if [[ -n "$perf_bin" ]]; then sudo ln -sf "$perf_bin" /usr/local/bin/perf; fi
          fi
          if ! perf stat -e instructions:u true; then
            echo "::warning::perf is unavailable; compile cost falls back to wall time and runtime is skipped"
          fi

      - name: Resolve and download exact baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          baseline="$(python3 .github/scripts/benchmark_base.py \
            "$(git rev-parse HEAD^1)" "$GITHUB_REPOSITORY" "$PR_NUMBER")"
          base_sha="$(jq -r .sha <<< "$baseline")"
          {
            echo "sha=$base_sha"
            echo "ref=$(jq -r .ref <<< "$baseline")"
          } >> "$GITHUB_OUTPUT"

          # Fork PR runs execute the fork's own bench.py, so only this repository's runs
          # are trusted baselines.
          list_runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bench.yml/runs?head_sha=$base_sha&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY)
                | {createdAt: .created_at, databaseId: .id, status}]'
          }
          runs_json="$(list_runs 2>/dev/null || echo '[]')"
          latest_run_id="$(
            jq -r --argjson current "$CURRENT_RUN_ID" \
              '[.[] | select(.databaseId != $current)] | max_by(.createdAt).databaseId // empty' \
              <<< "$runs_json"
          )"
          if [[ -n "$latest_run_id" ]]; then
            latest_status="$(
              jq -r --argjson run_id "$latest_run_id" \
                '.[] | select(.databaseId == $run_id) | .status' \
                <<< "$runs_json"
            )"
            if [[ "$latest_status" != "completed" ]]; then
              echo "Waiting for exact-base benchmark run $latest_run_id"
              gh run watch "$latest_run_id" --interval 10 || true
              runs_json="$(list_runs)"
            fi
          fi
          run_ids="$(
            jq -r --argjson current "$CURRENT_RUN_ID" \
              '[.[] | select(.databaseId != $current and .status == "completed")] | sort_by(.createdAt) | reverse | .[].databaseId' \
              <<< "$runs_json"
          )"

          # The JIT targets the host CPU, so only a baseline from the same CPU is comparable.
          host_cpu="$("$(llvm-config --bindir)/llc" --version | sed -n 's/^ *Host CPU: //p')"
          for run_id in $run_ids; do
            download_dir="$RUNNER_TEMP/jit-baseline-$run_id"
            if gh run download "$run_id" --name jit-bench-results --dir "$download_dir" 2>/dev/null &&
              [[ -f "$download_dir/results.json" && -d "$download_dir/artifacts" ]]; then
              base_cpu="$(jq -r .environment.target_cpu "$download_dir/results.json")"
              if [[ "$base_cpu" != "$host_cpu" ]]; then
                echo "Baseline run $run_id targets $base_cpu, not $host_cpu"
                continue
              fi
              mkdir -p target/jit-bench/baseline
              cp -R "$download_dir/results.json" "$download_dir/artifacts" target/jit-bench/baseline/
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No comparable baseline artifact for $base_sha; benchmarking it in this job"

      - name: Run JIT benchmark
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
        run: |
          set -euo pipefail
          args=(--output target/jit-bench --runtime)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$BASELINE_FOUND" != "true" ]]; then
            args+=(--diff "$BASE_SHA" --base-output target/jit-bench/baseline)
          fi
          if ! uv run scripts/jit/bench.py "$RUNNER_TEMP/jit-dump" "${args[@]}"; then
            echo "::warning::JIT benchmark failed to complete"
          fi

      # The PR comment is posted by bench-comment.yml, which regenerates it with trusted code.
      - name: Generate report
        if: always()
        env:
          BENCHMARK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCHMARK_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          BENCHMARK_BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          set -euo pipefail
          args=(
            --results target/jit-bench
            --report-output target/jit-bench/report.md
            --pr-comment-output target/jit-bench/comment.md
          )
          if [[ -f target/jit-bench/baseline/results.json ]]; then
            args+=(
              --baseline target/jit-bench/baseline
              --json-output target/jit-bench/comparison.json
            )
          fi
          uv run scripts/jit/compare.py "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-bench-results
          path: |
            target/jit-bench/
            !target/jit-bench/baseline/
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}
          if-no-files-found: ignore

      # Always uploaded on PRs: bench-comment.yml compares against it.
      - name: Upload baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-bench-baseline
          path: target/jit-bench/baseline/
          retention-days: 30
          if-no-files-found: ignore

  codspeed:
    name: codspeed (${{ matrix.shard }})
    runs-on: depot-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [interpreter, jit-burntpix, jit-rest]
    env:
      EVM2_BENCH_SHARD: ${{ matrix.shard }}
    permissions:
      id-token: write
      contents: read
    environment: codspeed
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@2ab28a31ae569be9f780c7675b684471060afa40 # 2026-10-09T21-43-19Z-2ab28a31
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: .github/scripts/install_llvm.sh ubuntu
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@2ab28a31ae569be9f780c7675b684471060afa40 # 2026-10-09T21-43-19Z-2ab28a31
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-bin: false
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target
        run: cargo codspeed build --profile profiling -p evm2-cli --features jit --bench evm
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          run: cargo codspeed run -p evm2-cli --bench evm
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
