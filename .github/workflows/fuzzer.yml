name: Differential Fuzzer

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/fuzzer.yml"
      - "Cargo.toml"
      - "crates/cli/**"
      - "crates/evm2/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

jobs:
  smoke:
    name: smoke (${{ matrix.dispatch_backend }})
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dispatch_backend: [tco, packed, single_return, unpacked]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@117919c943b804057be733b0c4034c5542e58959 # 2026-09-23T05-09-41Z-117919c9
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-bin: false
      - name: Replay regression corpus
        env:
          EVM2_DISPATCH_BACKEND: ${{ matrix.dispatch_backend }}
        run: cargo run -q -p evm2-cli -- fuzzer corpus crates/cli/fuzzer/corpus/failures
      - name: Run random fuzz smoke test
        env:
          EVM2_DISPATCH_BACKEND: ${{ matrix.dispatch_backend }}
        run: cargo run -q -p evm2-cli -- fuzzer --duration 3m -j 0
      - name: Upload failing fuzzer cases
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzer-failures-${{ matrix.dispatch_backend }}
          path: crates/cli/fuzzer/corpus/failures/*.json
          if-no-files-found: ignore

  ci-success:
    name: fuzzer success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - smoke
    permissions:
      contents: read
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
